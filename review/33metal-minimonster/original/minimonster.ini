MAX_LIMIT = 280
MAX_VELOCITY = 500
MAX_ACCELERATION = 6500.0



[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
STEPGEN_MAXVEL = 550
STEPGEN_MAXACCEL = 3500
SCALE = -1
FERROR = 1
MIN_FERROR = 50
MIN_LIMIT = 0
MAX_LIMIT = 280
HOME_OFFSET = 0.0
HOME = 0
HOME_SEQUENCE = 1



[AXIS_Z]
MIN_LIMIT = 0
MAX_LIMIT = 120
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000.0



[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
STEPGEN_MAXVEL = 550
STEPGEN_MAXACCEL = 3500
SCALE = 1
FERROR = 1
MIN_FERROR = 50
MIN_LIMIT = 0
MAX_LIMIT = 120
HOME_OFFSET = 120
HOME = 120
HOME_SEQUENCE = 0

[AXIS_A]


MAX_VELOCITY = 300
MAX_ACCELERATION = 1300.0



[JOINT_3]
TYPE = ANGULAR
MAX_VELOCITY = 300
MAX_ACCELERATION = 1300
STEPGEN_MAXVEL = 310
STEPGEN_MAXACCEL = 1500
SCALE = 1
FERROR = 10000
MIN_FERROR = 10000

HOME_OFFSET = 0
HOME = 0
max limit =
min limit =

