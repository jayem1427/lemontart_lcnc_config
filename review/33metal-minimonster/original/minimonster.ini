# EMC controller parameters for a simulated machine.
# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]
VERSION = 1.1
MACHINE =               33metal
#DEBUG =               0x7FFFFFFF
DEBUG = 5

# for details see nc_files/subroutines/maco_instructions.txt
# [DISPLAY]
# DISPLAY =axis







# These ini configuration items are required for probe basic.
# please compare contrast to your machine ini configuration
# and edit any matching existing items and/or add any items
# that are not under the corresponding ini sections.
[DISPLAY]
DISPLAY = probe_basic
PREFERENCE_FILE = probe_basic.pref
DRO_DISPLAY = XYZA
GEOMETRY = XYZA
TOOL_TABLE_COLUMNS = TDZR
CONFIG_FILE = probe_basic/custom_config.yml
USER_BUTTONS_PATH = probe_basic/user_buttons/
USER_DROS_PATH = probe_basic/user_dro_display/
USER_TABS_PATH = probe_basic/user_tabs/
ATC_TAB_DISPLAY = 0
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.5
MAX_SPINDLE_OVERRIDE = 1.0
MIN_SPINDLE_OVERRIDE = 0.1
MAX_LINEAR_VELOCITY = 500.0
MAX_ANGULAR_VELOCITY = 360.0
DEFAULT_LINEAR_VELOCITY = 6.35
DEFAULT_SPINDLE_SPEED = 200
PROGRAM_PREFIX = /home/jon/linuxcnc/nc_files:nc_files
INTRO_GRAPHIC = /usr/share/linuxcnc/linuxcnc.gif
INTRO_TIME = 0
TOOL_EDITOR = tooledit
INCREMENTS = JOG 10mm 1mm .1mm .01mm .001mm
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true

[ATC]
POCKETS = 1

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3


[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = probe_basic/tool.tbl
# TooTall18T Integration — TOOL_CHANGE_POSITION removed; macro handles G30 via #5181-#5183
# TooTall18T Integration — M6 does not move to G30 or retract Z (macro does)
TOOL_CHANGE_AT_G30 = 0
TOOL_CHANGE_QUILL_UP = 0



# Task controller section -----------------------------------------------------
[RS274NGC]


RS274NGC_STARTUP_CODE = F10 S300 G20 G17 G40 G49 G54 G61 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = probe_basic.var
FEATURES = 30
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
ON_ABORT_COMMAND = o<on_abort> call
# TooTall18T Integration — tool_touch_off.ngc, m600.ngc, go_to_g30.ngc in probe_basic/subroutines
SUBROUTINE_PATH = .:probe_basic/subroutines
USER_M_PATH = .:probe_basic/subroutines
# TooTall18T Integration — semi-auto tool setter from CAM (do not remap M6)
REMAP=M600 modalgroup=6 ngc=m600

# Motion control section ------------------------------------------------------
[EMCMOT]
EMCMOT =              motmod
COMM_TIMEOUT =          1.0
SERVO_PERIOD =          1000000

# Hardware Abstraction Layer section --------------------------------------------------
[TASK]
TASK =                  milltask
CYCLE_TIME =            0.001


[HALUI]
MDI_COMMAND = G10 L20 P0 X0
MDI_COMMAND = G10 L20 P0 Y0
MDI_COMMAND = G10 L20 P0 Z0
MDI_COMMAND = G0 X[#<_x>/2]
MDI_COMMAND = G0 Y[#<_y>/2]
MDI_COMMAND = (debug, Macro 5)
MDI_COMMAND = (debug, Macro 6)
MDI_COMMAND = (debug, Macro 7)
MDI_COMMAND = (debug, Macro 8)
MDI_COMMAND = (debug, Macro 9)
MDI_COMMAND = (debug, Macro 10)
MDI_COMMAND = (debug, Macro 11)
MDI_COMMAND = (debug, Macro 12)
MDI_COMMAND = (debug, Macro 13)
MDI_COMMAND = (debug, Macro 14)


# Part program interpreter section --------------------------------------------
[HAL]
HALUI = halui
HALFILE = cia402.hal
HALFILE = custom.hal


POSTGUI_HALFILE = probe_basic_postgui.hal
TWOPASS = one


#HALFILE = REVOLVER.HAL      



# Trajectory planner section --------------------------------------------------



[TRAJ]
COORDINATES =      X Y Z A
LINEAR_UNITS =     mm
ANGULAR_UNITS =    degree
DEFAULT_LINEAR_VELOCITY = 20
DEFAULT_ANGULAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 700
MAX_ANGULAR_VELOCITY = 360
#POSITION_FILE =    position.txt
NO_FORCE_HOMING = 1
SPINDLES = 1



[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 330
MAX_VELOCITY = 700
MAX_ACCELERATION = 3000.0



[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 500
MAX_ACCELERATION = 3000
STEPGEN_MAXVEL = 550
STEPGEN_MAXACCEL = 3500
SCALE = -1
FERROR = 1
MIN_FERROR = 50
MIN_LIMIT = 0
MAX_LIMIT = 330

HOME_OFFSET = 0.0
HOME = 0
HOME_SEQUENCE = 2


[AXIS_Y]
