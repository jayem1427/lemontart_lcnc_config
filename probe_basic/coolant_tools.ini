# Per-tool PWM coolant recipes for M102.
# Missing T-section → [DEFAULT]. Tool 0 (empty spindle) always writes zeros.
# T99 (touch probe) is explicitly dry.
#
# Units match M101: FREQ Hz, DUTY percent, PRESSURE psi.
# Port 1: 10 Hz / 1 % is H1 = 1 ms pulse, H2 = 100 ms period.
# M102 writes that recipe; M8/M9 own the coil. See docs/MICROJECT.md.
# Omit a key to inherit that field from [DEFAULT].

[DEFAULT]
FREQ = 10
DUTY = 1
PRESSURE = 0

[T3]
DUTY = 2

[T9]
DUTY = 1

[T10]
DUTY = 1

[T12]
DUTY = 2

[T14]
DUTY = 1

[T17]
DUTY = 1

[T18]
DUTY = 2

[T99]
FREQ = 0
DUTY = 0
PRESSURE = 0
