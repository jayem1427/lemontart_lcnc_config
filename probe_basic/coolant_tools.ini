# Per-tool PWM coolant recipes for M102.
# Missing T-section → [DEFAULT]. Tool 0 (empty spindle) always writes zeros.
# T99 (touch probe) is explicitly dry.
#
# Units match M101: FREQ Hz, DUTY percent, PRESSURE psi.
# Microject firmware default is 10 Hz / 1 % (1 ms on, 100 ms period) until
# holding-register addresses are known — M8 only flips coil 1 for now.
# Omit a key to inherit that field from [DEFAULT].

[DEFAULT]
FREQ = 10
DUTY = 1
PRESSURE = 0

[T3]
DUTY = 2

[T9]
DUTY = 1

[T10]
DUTY = 1

[T12]
DUTY = 2

[T14]
DUTY = 1

[T17]
DUTY = 1

[T18]
DUTY = 2

[T99]
FREQ = 0
DUTY = 0
PRESSURE = 0
