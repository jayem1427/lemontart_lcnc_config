# PWM coolant recipes for M202: named presets, and which preset each tool uses.
# Presets are tool-agnostic: any preset can go on any tool, and editing a
# preset changes every tool that uses it. The MQL tab edits this file
# (comments are kept); M202 re-reads it on every call.
#
#   [DEFAULT]          tools with no entry, and keys a preset leaves out
#   [PRESET <name>]    a named recipe
#   [T<n>]             PRESET = <name>. Optional FREQ/DUTY/PRESSURE here
#                      override that preset for this tool only.
#
# Tool 0 (empty spindle) is always dry.
# Units match M201: FREQ Hz, DUTY percent, PRESSURE psi.
# Converted 2026-11-28 from per-tool numbers. Every tool kept its values.

[DEFAULT]
FREQ = 10
DUTY = 1
PRESSURE = 0

[PRESET Standard]
FREQ = 10
DUTY = 1

[PRESET Heavy]
FREQ = 10
DUTY = 2

[PRESET Light pulse]
FREQ = 1
DUTY = 0.3

[PRESET Dry]
FREQ = 0
DUTY = 0
PRESSURE = 0

[T1]
PRESET = Light pulse

[T3]
PRESET = Heavy

[T9]
PRESET = Standard

[T10]
PRESET = Standard

[T12]
PRESET = Heavy

[T14]
PRESET = Standard

[T17]
PRESET = Standard

[T18]
PRESET = Heavy

# T99 is the touch probe: never spray.
[T99]
PRESET = Dry
