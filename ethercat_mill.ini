[EMC]
VERSION = 1.1
MACHINE = ethercat_mill
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic
PREFERENCE_FILE = probe_basic.pref
DRO_DISPLAY = XYZA
GEOMETRY = XYZA
TOOL_TABLE_COLUMNS = TDZR
CONFIG_FILE = probe_basic/custom_config.yml
USER_BUTTONS_PATH = probe_basic/user_buttons/
USER_DROS_PATH = probe_basic/user_dro_display/
USER_TABS_PATH = probe_basic/user_tabs/
ATC_TAB_DISPLAY = 0
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.5
MAX_SPINDLE_OVERRIDE = 1.0
MIN_SPINDLE_OVERRIDE = 0.1
MAX_LINEAR_VELOCITY = 500.0
MAX_ANGULAR_VELOCITY = 360.0
DEFAULT_LINEAR_VELOCITY = 6.35
DEFAULT_SPINDLE_SPEED = 200
PROGRAM_PREFIX = /home/jon/linuxcnc/nc_files
INTRO_GRAPHIC = /usr/share/linuxcnc/linuxcnc.gif
INTRO_TIME = 0
TOOL_EDITOR = tooledit
INCREMENTS = JOG 10mm 1mm .1mm .01mm .001mm
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true

# Manual collet spindle — POCKETS=1 satisfies Probe Basic ATC-aware subroutines (tab hidden via ATC_TAB_DISPLAY=0)
[ATC]
POCKETS = 1

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
# Keep G43 on Stop: on_abort.ngc calls restore_tool_length.ngc.
# Do NOT put o<...> in RS274NGC_STARTUP_CODE — interp reports
# "Bad character 'o' used on startup". Also no G49 here: stock
# Probe Basic G49 on M30/init is the same work-Z jump as Stop.
# Interp default is still G49 when no G43 has been issued yet.
# Mid-M600 dialog abort still G49s in abort_tool_change.ngc.
# Revert: put G49 after G40. See docs/DEVIATIONS.md "Keep G43 on Stop".
RS274NGC_STARTUP_CODE = F10 S300 G21 G17 G40 G54 G64 P0.001 G80 G90 G91.1 G94 G97 G98
FEATURES = 30
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
ON_ABORT_COMMAND = o<on_abort> call
# TooTall18T Integration — tool_touch_off.ngc, m600.ngc, go_to_g30.ngc in probe_basic/subroutines
SUBROUTINE_PATH = .:probe_basic/subroutines
USER_M_PATH = .:probe_basic/subroutines
# TooTall18T Integration — semi-auto tool setter from CAM (do not remap M6)
REMAP=M600 modalgroup=6 ngc=m600
# PWM coolant. M100-M199 cannot be remapped (reserved for user M-files) —
# M101 P.. failed with "P word with no G2 ...". argspec=pqr: optional P/Q/R.
REMAP=M201 modalgroup=10 argspec=pqr ngc=m201
# python= names are looked up inside remap.py only (no dotted module paths).
REMAP=M202 modalgroup=10 python=apply_tool_coolant

[PYTHON]
PATH_PREPEND = ./probe_basic/python
TOPLEVEL = ./probe_basic/python/toplevel.py

# Microject injector (Dan Mills). M8/M9 → coil 1.
# 19200 8E1 slave 8 on /dev/ttyUSB0. H100 mb2hal is not loaded (38400 8N1).
# Port 1: coil 1, Hreg 1 = pulse ms, Hreg 2 = period ms (see microject.mb2hal).
[COOLANT]
SLAVE_ID = 8
INJECTOR_PORT = 1
SERIAL_PORT = /dev/ttyUSB0
SERIAL_BAUD = 19200
SERIAL_PARITY = even
PULSE_SCALE = 1.0
PERIOD_SCALE = 1.0
DEFAULT_FREQ = 10
DEFAULT_DUTY = 1
DEFAULT_PRESSURE = 0
PROFILE_FILE = probe_basic/coolant_tools.ini

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

# Laser DS-5V-M: G38 uses flute envelope (on-delay 0, off-delay BEAM_OFF_DELAY).
# First-tooth G38.3 still trips immediately; G38.5 clear needs the off-delay.
[LASER]
BEAM_OFF_DELAY = 0.050

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = probe_basic/tool.tbl
# TooTall18T Integration — TOOL_CHANGE_POSITION removed; macro handles G30 via #5181-#5183
# TooTall18T Integration — M6 does not move to G30 or retract Z (macro does)
TOOL_CHANGE_AT_G30 = 0
TOOL_CHANGE_QUILL_UP = 0

[HAL]
TWOPASS = on
HALUI = halui
POSTGUI_HALFILE = probe_basic/probe_basic_postgui.hal
HALFILE = ethercat_loadusr.hal
HALFILE = ethercat_mill.hal
HALFILE = probe_beep.hal
HALFILE = xhc-whb04b-6.hal
HALFILE = custom.hal
HALFILE = coolant.hal

[HALUI]
MDI_COMMAND = G10 L20 P0 X0
MDI_COMMAND = G10 L20 P0 Y0
MDI_COMMAND = G10 L20 P0 Z0
MDI_COMMAND = G0 X[#<_x>/2]
MDI_COMMAND = G0 Y[#<_y>/2]
MDI_COMMAND = (debug, Macro 5)
MDI_COMMAND = (debug, Macro 6)
MDI_COMMAND = (debug, Macro 7)
MDI_COMMAND = (debug, Macro 8)
MDI_COMMAND = (debug, Macro 9)
MDI_COMMAND = (debug, Macro 10)
MDI_COMMAND = (debug, Macro 11)
MDI_COMMAND = (debug, Macro 12)
MDI_COMMAND = (debug, Macro 13)
MDI_COMMAND = (debug, Macro 14)

[TRAJ]
SPINDLES = 1
COORDINATES = XYZA
AXES = 4
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 500.0
MAX_ANGULAR_VELOCITY = 360.0
DEFAULT_LINEAR_ACCELERATION = 6865.0
MAX_LINEAR_ACCELERATION = 6865.0
# tpnext-ma experimental planner (RIP build via launch-tpnext.sh).
# PLANNER_TYPE: 0=trapezoidal fallback, 1=path-based / jerk-limited.
# Start with high jerk (less soft); lower values = smoother / slower ramps.
TPMOD = tpnextmod
PLANNER_TYPE = 1
MAX_LINEAR_JERK = 30000.0
DEFAULT_LINEAR_JERK = 30000.0
POSITION_FILE = position.txt
# Jog/MDI without homing first. REF ALL still does real X/Y/Z search.
NO_FORCE_HOMING = 1

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[AXIS_X]
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -254.0
MAX_LIMIT = 370.0

[AXIS_Y]
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -254.0
MAX_LIMIT = 308.0

[AXIS_Z]
MAX_VELOCITY = 166.666667
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -203.2
# Soft max must clear unhomed absolute encoder (~300+ mm) so Z can jog before HOME ALL.
MAX_LIMIT = 400.0

[AXIS_A]
MAX_VELOCITY = 360.0
MAX_ACCELERATION = 1200.0
MAX_JERK = 30000.0
MIN_LIMIT = -9999.0
MAX_LIMIT = 9999.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -254.0
MAX_LIMIT = 370.0
# 17-bit encoder: 131072 counts/rev; 10 mm ball screw pitch -> 131072/10 counts/mm
SCALE = 13107.2
# Same-sign latch: search -, back off + until home clears, slow re-approach -.
# Offset -5 so parked X0 is further off the switch (repeat home was still on it).
# Latch dist 25 mm so backoff can actually leave a long home flag.
HOME_OFFSET = -5.0
HOME_SEARCH_VEL = -12.0
HOME_LATCH_VEL = -0.833333
HOME_FINAL_VEL = 3.333332
HOME_SEARCH_DIST = 450.0
HOME_LATCH_DIST = 25.0
# REF ALL / home-all order: Z(0) → X(1) → Y(2) → A(3); distinct seq numbers = wait for prior to finish.
HOME_SEQUENCE = 1
HOME_IS_SHARED = 0
# Home at negative end shares the limit chain (Slave 0 DI1); must ignore limits during homing.
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
# Relaxed — was 2.0/1.0; restore wide limits so ferror does not trip during jog/home
FERROR = 1270.0
MIN_FERROR = 254.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 500.0
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -254.0
MAX_LIMIT = 308.0
# Seek -Y to shared Y/Z home bus, same latch as X.
# HAL ignores a closed shared bus at homing *start* (searches -Y until the
# bus has been seen open, then latches the next close). HOME_IS_SHARED=1
# was aborting Z and still letting Y latch in place — do not use it here.
HOME_OFFSET = -2.0
HOME_SEARCH_VEL = -33.333332
HOME_LATCH_VEL = -0.833333
HOME_FINAL_VEL = 3.333332
HOME_SEARCH_DIST = 450.0
HOME_LATCH_DIST = 8.0
HOME_SEQUENCE = 2
HOME_IS_SHARED = 0
# Home at negative end shares the limit chain (Slave 0 DI2); must ignore limits during homing.
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
FERROR = 1270.0
MIN_FERROR = 254.0
SCALE = 13107.2

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 166.666667
MAX_ACCELERATION = 6865.0
MAX_JERK = 30000.0
MIN_LIMIT = -203.2
MAX_LIMIT = 400.0
# Home on Slave 1 DI4 (+Z end). Search is +Z only.
# If the shared Y/Z bus is already closed at REF Z, HAL hides it so Z
# searches up instead of backing off down. Latch on the next rising edge
# after the bus has been seen open.
# HOME_OFFSET=+2 sets machine zero 2 mm below the home switch.
# First in REF ALL (seq 0).
HOME_OFFSET = 2.0
HOME_SEARCH_VEL = 33.333332
HOME_LATCH_VEL = 0.833333
HOME_FINAL_VEL = 3.333332
HOME_SEARCH_DIST = 450.0
HOME_LATCH_DIST = 8.0
HOME_SEQUENCE = 0
HOME_IS_SHARED = 0
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
FERROR = 1270.0
MIN_FERROR = 254.0
SCALE = 13107.2

[JOINT_3]
TYPE = ANGULAR
HOME = 0.0
MAX_VELOCITY = 360.0
MAX_ACCELERATION = 1200.0
MAX_JERK = 30000.0
MIN_LIMIT = -9999.0
MAX_LIMIT = 9999.0
HOME_OFFSET = 0.0
# BREAKOUT OFF: last in REF ALL; zero search/latch = mark homed at current position (no A home switch).
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 3
FERROR = 1270.0
MIN_FERROR = 254.0
# Same 131072 counts/motor rev; ANGULAR_UNITS=degree -> 131072/360 counts/deg (motor uncoupled from load)
SCALE = 364.088888889

# Limit/home DI routing and EtherCAT motion HAL live in ethercat_mill.hal (not here).
